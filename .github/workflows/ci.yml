name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@main

  manifest-guard:
    uses: codefly-dev/.github/.github/workflows/plugin-manifest-guard.yml@main

  effective-inputs-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: docker pull node:22-alpine
      - run: go test -tags ciinputs_conformance -run TestEffectiveInputsNative -count=1 -timeout 300s ./...
